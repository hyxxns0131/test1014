<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>지옥 인성 테스트 - 사이코패스 판독기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0d0d0d;
    --blood: #ff1e27;
    --pumpkin: #ff7518;
    --purple: #b026ff;
    --text: #fff6f6;
    --muted: #e6d6d6;
    --glass: rgba(20, 6, 10, 0.6);
    --glass-border: rgba(255, 30, 39, 0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { min-height: 100%; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text);
    background-color: var(--black);
    background-image: url('image/image1.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* 검붉은 반투명 오버레이 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at top, rgba(110, 0, 12, 0.35), transparent 60%),
      linear-gradient(180deg, rgba(13, 13, 13, 0.85) 0%, rgba(38, 0, 6, 0.85) 60%, rgba(13, 13, 13, 0.9) 100%);
    z-index: 0;
    pointer-events: none;
  }

  /* 떠다니는 불씨 */
  .embers { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .ember {
    position: absolute;
    bottom: -10px;
    border-radius: 50%;
    background: var(--pumpkin);
    box-shadow: 0 0 8px var(--pumpkin), 0 0 16px var(--blood);
    opacity: 0;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: 0.9; }
    100% { transform: translateY(-110vh) translateX(40px); opacity: 0; }
  }

  .app {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 3vw, 32px) clamp(14px, 3vw, 32px) clamp(84px, 12vh, 104px);
  }

  .card {
    width: 100%;
    max-width: 560px;
    background: var(--glass);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: clamp(22px, 4.5vw, 40px);
    box-shadow:
      0 0 24px rgba(255, 30, 39, 0.35),
      0 0 60px rgba(176, 38, 255, 0.18),
      inset 0 0 30px rgba(255, 30, 39, 0.08);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .card.fade-out { opacity: 0; transform: translateY(8px) scale(0.99); }

  .screen { display: none; flex-direction: column; }
  .screen.active { display: flex; }

  /* ---------- 시작 화면 (고대비 + 글로우) ---------- */
  .intro { text-align: center; gap: clamp(16px, 2.8vh, 26px); }
  .intro .tag {
    align-self: center;
    font-size: clamp(11px, 2.8vw, 13px);
    font-weight: 900;
    letter-spacing: 3px;
    color: #ffb07a;
    border: 1.5px solid var(--pumpkin);
    border-radius: 999px;
    padding: 6px 14px;
    text-shadow: 0 0 6px var(--pumpkin), 0 0 14px rgba(255, 117, 24, 0.8);
    box-shadow: 0 0 12px rgba(255, 117, 24, 0.55), inset 0 0 8px rgba(255, 117, 24, 0.3);
  }
  .intro h1 {
    font-family: 'Black Han Sans', sans-serif;
    font-weight: 400;
    font-size: clamp(34px, 9.5vw, 54px);
    line-height: 1.15;
    letter-spacing: 1px;
    color: #ffffff;
    text-shadow:
      0 0 4px #fff,
      0 0 10px var(--blood),
      0 0 22px var(--blood),
      0 0 42px rgba(255, 30, 39, 0.85),
      0 0 70px rgba(176, 38, 255, 0.55);
  }
  .intro h1 .sub {
    display: block;
    margin-top: 6px;
    font-size: 0.7em;
    color: #ff4d55;
    text-shadow:
      0 0 6px #ff1e27,
      0 0 16px #ff1e27,
      0 0 32px rgba(255, 30, 39, 0.9);
  }
  .intro p {
    color: #ffffff;
    font-size: clamp(15px, 4vw, 17px);
    font-weight: 700;
    line-height: 1.75;
    word-break: keep-all;
    text-shadow: 0 0 6px rgba(0, 0, 0, 0.9), 0 0 14px rgba(255, 117, 24, 0.55);
  }
  .intro p strong {
    color: var(--pumpkin);
    text-shadow: 0 0 6px var(--pumpkin), 0 0 16px rgba(255, 117, 24, 0.8);
  }
  .intro .warn {
    font-size: clamp(13px, 3.4vw, 14px);
    font-weight: 900;
    color: #ff5a61;
    background: rgba(255, 30, 39, 0.14);
    border: 1.5px solid var(--blood);
    border-radius: 12px;
    padding: 11px 12px;
    text-shadow: 0 0 6px rgba(255, 30, 39, 0.9);
    box-shadow: 0 0 14px rgba(255, 30, 39, 0.4);
    word-break: keep-all;
  }

  /* ---------- 버튼 ---------- */
  .btn {
    font-family: inherit;
    font-weight: 700;
    font-size: clamp(15px, 4vw, 17px);
    color: var(--text);
    border: none;
    border-radius: 14px;
    padding: clamp(13px, 2.2vh, 16px) 18px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease, opacity 0.25s ease, border-color 0.2s ease;
    user-select: none;
  }
  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: linear-gradient(135deg, var(--blood), #a3000a);
    box-shadow: 0 0 14px rgba(255, 30, 39, 0.6), 0 0 30px rgba(255, 30, 39, 0.25);
  }
  .btn-primary:hover { box-shadow: 0 0 20px rgba(255, 30, 39, 0.9), 0 0 44px rgba(176, 38, 255, 0.35); }

  .btn-purple {
    background: linear-gradient(135deg, #6a0dad, var(--purple));
    box-shadow: 0 0 14px rgba(176, 38, 255, 0.55);
  }
  .btn-purple:hover { box-shadow: 0 0 22px rgba(176, 38, 255, 0.85); }

  /* ---------- 질문 화면 ---------- */
  .progress-wrap { margin-bottom: clamp(18px, 3vh, 28px); }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .progress-label { font-size: clamp(12px, 3.2vw, 13px); color: var(--muted); letter-spacing: 2px; font-weight: 700; }
  .progress-count { font-family: 'Black Han Sans', sans-serif; font-size: clamp(18px, 5vw, 22px); color: var(--blood); text-shadow: 0 0 8px var(--blood); }
  .progress-count small { color: var(--muted); font-size: 0.7em; text-shadow: none; }
  .progress-bar {
    height: 10px;
    background: rgba(255, 255, 255, 0.07);
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid rgba(255, 30, 39, 0.25);
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #7a0008, var(--blood), var(--pumpkin));
    box-shadow: 0 0 12px var(--blood);
    border-radius: 999px;
    transition: width 0.4s ease;
  }

  .q-body { transition: opacity 0.3s ease, transform 0.3s ease; }
  .q-body.fade-out { opacity: 0; transform: translateX(-14px); }
  .q-body.fade-in-start { opacity: 0; transform: translateX(14px); }

  .q-num {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(14px, 3.8vw, 16px);
    color: var(--pumpkin);
    text-shadow: 0 0 8px rgba(255, 117, 24, 0.7);
    margin-bottom: 10px;
    letter-spacing: 1px;
  }
  .q-text {
    font-size: clamp(18px, 5vw, 23px);
    font-weight: 700;
    line-height: 1.55;
    word-break: keep-all;
    min-height: 4.65em;
    margin-bottom: clamp(18px, 3.4vh, 30px);
  }

  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ans {
    font-size: clamp(17px, 4.6vw, 20px);
    padding: clamp(16px, 3vh, 22px) 10px;
    background: rgba(255, 255, 255, 0.05);
    border: 1.5px solid rgba(255, 255, 255, 0.16);
  }
  .ans.yes:hover { border-color: var(--blood); box-shadow: 0 0 16px rgba(255, 30, 39, 0.55); }
  .ans.no:hover { border-color: var(--purple); box-shadow: 0 0 16px rgba(176, 38, 255, 0.55); }
  .ans.yes.selected {
    background: linear-gradient(135deg, var(--blood), #9c0009);
    border-color: var(--blood);
    box-shadow: 0 0 18px var(--blood), 0 0 36px rgba(255, 30, 39, 0.4);
  }
  .ans.no.selected {
    background: linear-gradient(135deg, #5c0b94, var(--purple));
    border-color: var(--purple);
    box-shadow: 0 0 18px var(--purple), 0 0 36px rgba(176, 38, 255, 0.4);
  }

  /* ---------- 이전 버튼: 화면 좌하단 고정 ---------- */
  .prev-btn {
    position: fixed;
    left: max(16px, env(safe-area-inset-left));
    bottom: max(16px, env(safe-area-inset-bottom));
    z-index: 5;
    font-size: clamp(14px, 3.6vw, 15px);
    padding: 12px 20px;
    background: rgba(13, 13, 13, 0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1.5px solid rgba(255, 117, 24, 0.6);
    color: #ffd2b3;
    box-shadow: 0 0 12px rgba(255, 117, 24, 0.35);
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
  }
  .prev-btn.show { opacity: 1; visibility: visible; transform: translateY(0); }
  .prev-btn:hover { border-color: var(--pumpkin); box-shadow: 0 0 18px rgba(255, 117, 24, 0.7); color: #fff; }

  /* ---------- 결과 화면 ---------- */
  .result { text-align: center; }
  .result .label {
    font-size: clamp(11px, 3vw, 13px);
    letter-spacing: 3px;
    font-weight: 700;
    color: var(--pumpkin);
    margin-bottom: 12px;
  }
  .char-frame {
    height: clamp(200px, 38vh, 340px);
    aspect-ratio: 2 / 3;
    margin: 0 auto clamp(14px, 2vh, 18px);
    border-radius: 28px;
    padding: 4px;
    background: linear-gradient(135deg, var(--blood), var(--purple), var(--pumpkin));
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 22px rgba(255, 30, 39, 0.6), 0 0 44px rgba(176, 38, 255, 0.35); }
    50% { box-shadow: 0 0 32px rgba(255, 30, 39, 0.9), 0 0 64px rgba(176, 38, 255, 0.55); }
  }
  .char-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    border-radius: 24px;
    display: block;
    background: radial-gradient(circle at 50% 35%, #3a0610, #0d0d0d);
  }
  .score {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(34px, 9vw, 48px);
    line-height: 1;
    color: var(--blood);
    text-shadow: 0 0 10px var(--blood), 0 0 28px rgba(255, 30, 39, 0.6);
    margin-bottom: 4px;
  }
  .score small { font-size: 0.45em; color: var(--muted); text-shadow: none; }
  .lie-badge {
    display: inline-block;
    font-size: clamp(11px, 3vw, 12px);
    font-weight: 700;
    color: #fff;
    background: var(--blood);
    border-radius: 999px;
    padding: 4px 12px;
    margin: 6px 0 4px;
    box-shadow: 0 0 12px var(--blood);
    animation: blink 1.2s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }
  .r-type {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(18px, 5vw, 24px);
    line-height: 1.35;
    color: var(--pumpkin);
    text-shadow: 0 0 8px rgba(255, 117, 24, 0.6);
    margin: 10px 0 8px;
    word-break: keep-all;
  }
  .r-title {
    font-size: clamp(15px, 4vw, 17px);
    font-weight: 900;
    color: #fff;
    margin-bottom: 10px;
    word-break: keep-all;
  }
  .r-desc {
    font-size: clamp(13px, 3.5vw, 15px);
    line-height: 1.7;
    color: var(--muted);
    word-break: keep-all;
    background: rgba(0, 0, 0, 0.3);
    border-left: 3px solid var(--blood);
    border-radius: 10px;
    padding: 12px 14px;
    text-align: left;
  }
  .r-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: clamp(16px, 2.6vh, 22px); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translate(-50%, 20px);
    background: rgba(13, 13, 13, 0.92);
    border: 1px solid var(--purple);
    box-shadow: 0 0 16px rgba(176, 38, 255, 0.6);
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
    padding: 12px 20px;
    border-radius: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 10;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 380px) {
    .r-actions { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="embers" id="embers"></div>

  <main class="app">
    <section class="card" id="card">

      <!-- 시작 화면 -->
      <div class="screen intro active" id="introScreen">
        <div class="tag">HELL GATE PERSONALITY TEST</div>
        <h1>지옥 인성 판독기<span class="sub">사이코패스 테스트</span></h1>
        <p>당신의 양심은 아직 살아 있습니까?<br><strong>30개의 매운맛 질문</strong>으로 지옥 입주 등급을 판정합니다.</p>
        <div class="warn">솔직하게 답하세요. 지옥의 거짓말 탐지기가 작동 중입니다.</div>
        <button class="btn btn-primary" id="startBtn">지옥문 열기</button>
      </div>

      <!-- 질문 화면 -->
      <div class="screen" id="quizScreen">
        <div class="progress-wrap">
          <div class="progress-top">
            <span class="progress-label">SOUL SCAN</span>
            <span class="progress-count" id="progressCount">1 <small>/ 30</small></span>
          </div>
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        </div>

        <div class="q-body" id="qBody">
          <div class="q-num" id="qNum">Q1.</div>
          <div class="q-text" id="qText"></div>
          <div class="answers">
            <button class="btn ans yes" data-answer="yes">예</button>
            <button class="btn ans no" data-answer="no">아니오</button>
          </div>
        </div>
      </div>

      <!-- 결과 화면 -->
      <div class="screen result" id="resultScreen">
        <div class="label">YOUR HELL RANK</div>
        <div class="char-frame"><img id="rImg" alt="결과 캐릭터"></div>
        <div class="score" id="rScore">0<small> / 300점</small></div>
        <div id="rBadge"></div>
        <div class="r-type" id="rType"></div>
        <div class="r-title" id="rTitle"></div>
        <div class="r-desc" id="rDesc"></div>
        <div class="r-actions">
          <button class="btn btn-primary" id="retryBtn">테스트 다시하기</button>
          <button class="btn btn-purple" id="copyBtn">결과 링크 복사하기</button>
        </div>
      </div>

    </section>
  </main>

  <!-- 화면 좌하단 고정 이전 버튼 -->
  <button class="btn prev-btn" id="prevBtn" aria-label="이전 문항">&lsaquo; 이전</button>

  <div class="toast" id="toast">링크가 복사되었습니다</div>

<script>
  const QUESTIONS = [
    "나는 누군가 대화할 때 음침하게 문 뒤에서 엿듣는다.",
    "나는 누군가 엘리베이터를 타려고 뛰어올 때 같이 타기 싫어 닫힘 버튼을 누른다.",
    "나는 운전할 때 옆에 나보다 빨리 달리는 차가 있으면 추월하기 위해 속도를 올린다.",
    "길을 걷다 복도나 길목에서 마주친 지인이 나를 못 본 척 지나치길 간절히 바라며 먼저 폰을 본 척한다.",
    "친구가 카톡을 보냈을 때 미리보기로 확인한 뒤, 답장하기 귀찮아서 몇 시간 동안 안 읽은 척 방치한다.",
    "단톡방에서 대화가 끊겼을 때, 내가 마지막 말을 남겨 '씹힌 모양새'가 되는 꼴은 절대 못 참는다.",
    "친구가 자랑하고 싶어 안달 난 티를 낼 때, 일부러 리액션을 건조하게 해서 맥을 끊어버린다.",
    "길거리에서 모르는 사람이 크게 넘어졌을 때, 걱정보다는 웃음이 터져 나오는 걸 참느라 입술을 깨문 적이 있다.",
    "배달 음식이 왔을 때 배달원이 완전히 엘리베이터를 타고 내려갈 때까지 숨죽이고 문 뒤에서 기다린다.",
    "친구가 연인과 헤어졌다는 소식을 들었을 때, 겉으로는 위로하면서 속으로는 은근히 도파민이 돈다.",
    "약속 시간에 늦어놓고 \"택시가 너무 안 잡혔다\"거나 \"길이 막혔다\"며 당당하게 연기를 해본 적이 있다.",
    "남이 힘들어할 때 \"나도 그런 적 있어\"라며 내 불행 배틀을 시작해 화제를 나에게로 돌린다.",
    "친구가 입은 옷이나 스타일링이 솔직히 별로일 때, \"완전 힙하다\"며 그대로 망신당하게 둔 적이 있다.",
    "계산대 앞에서 결제할 타이밍이 오면 지갑을 찾는 척 가방 속을 유독 천천히 뒤적인다.",
    "공공장소(지하철, 버스)에서 내 옆자리에 아무도 앉지 않길 바라며 일부러 좁게 앉거나 짐을 넉넉히 둔다.",
    "전여자친구의 SNS를 몰래 염탐하다가 실수로 '좋아요'나 스토리를 밟을 뻔해서 심장이 내려앉아 욕을 한 적이 있다.",
    "맛있는 음식을 같이 나눠 먹을 때, 티 안 나게 제일 크고 실한 부위를 슬쩍 집어온다.",
    "직장이나 팀플에서 내가 실수했을 때, 다른 사람의 탓으로 자연스럽게 몰고 갈 수 있을지 0.1초 고민해본 적이 있다.",
    "남이 칭찬받는 걸 들으면 \"저 정도는 나도 할 수 있는데\"라며 속으로 은근히 깎아내린다.",
    "약속 직전에 상대방이 안 좋은 일 생겨서 약속을 취소해 주기를 간절히 기도한 적이 있다.",
    "뷔페나 식당에서 음료나 리필을 흘릴 때, 내가 흘린 걸 아무도 안 봤다면 모른 척 조용히 자리를 뜬다.",
    "내가 관심 없는 남의 연애사나 고민 상담을 들을 때, 머릿속으로는 오늘 저녁 메뉴를 고민하고 있다.",
    "친구가 비싼 물건을 샀다고 보여줄 때, 속으로 \"훔칠까?\" 하는 못된 생각이 스친 적이 있다.",
    "친구 집 놀러 갔을 때 변기 물이 잘 안 내려가서 막힐 뻔하자, 뚫어보려다 실패할까 봐 조용히 뚜껑 닫고 나와 모른 척한 적이 있다.",
    "넷플릭스나 유튜브를 보다가 지인이 \"그거 결말 어떻게 돼?\"라고 물어보면 스포일러를 하고 싶은 충동을 참기 힘들다.",
    "나와 별로 안 친한 동기의 뒷담화가 시작되면 은근슬쩍 대화에 끼어들어 귀를 쫑긋 세운다.",
    "단체 사진을 찍은 뒤 사진을 고를 때, 다른 애들이 엽사 수준으로 나와도 내가 잘 나왔으면 그걸 단톡방에 올린다.",
    "길거리에서 통화하는 모르는 사람이 싸우거나 울고 있으면, 궁금해서 보폭을 맞춰 천천히 걸으며 끝까지 엿들은 적이 있다.",
    "게임이나 내기에서 졌을 때, \"네가 비매너로 해서 그런 거다\"라며 남 탓이나 핑계를 대본 적이 있다.",
    "이 질문들을 보면서 \"나는 솔직히 천사인데?\"라고 생각하며 스스로의 악행을 합리화하고 있다."
  ];

  const RESULTS = {
    liar: {
      type: "너가 제일 나빠! 거짓말쟁이 위선자! 사탄도 울고갈 거짓말 악마",
      title: "거짓말 작작 하세요! 악마도 기함할 내숭 100단 최고 사이코",
      desc: "30개 중에 3개 이하라고요? 경찰 불러야 합니다. 남들 다 하는 찌질한 짓 한 번도 안 해본 척, 세상 순결한 척 연기하는 당신이 진정한 지옥의 지배자입니다. 당신의 결백함 자체가 거대한 범죄입니다.",
      img: "image/devil_1.png"
    },
    imp: {
      type: "침대 밑 소심한 찌질귀신, 방구석 먼지악마 (소악마형)",
      title: "남한테 대놓고 긁히면 집 와서 샤워기 틀고 우는 타입",
      desc: "대단한 악행은 쫄려서 못 저지르고, 남 몰래 카톡 1 안 사라지게 훔쳐보거나 계단에서 꿍얼거리며 정신승리하는 귀여운 수준의 찌질이입니다. 지옥에 가도 청소 잡일이나 맡게 될 운명입니다.",
      img: "image/devil_2.png"
    },
    reaper: {
      type: "남의 불행으로 혈당 채우는 팝콘 저승사자 (도파민 기생형)",
      title: "겉은 모범시민, 속은 막장 드라마 1열 관람객",
      desc: "겉으로는 \"헐 어떡해ㅠㅠ\" 하면서 눈물 닦아주지만, 속으로는 도파민 폭발해서 동공 확장되는 현실 밀착형 빌런입니다. 남 망신당하거나 싸움 구경하는 게 인생 최고의 뷔페입니다.",
      img: "image/devil_3.png"
    },
    rage: {
      type: "분노조절장애 불도저, 화염의 급발진마 (광기 폭주형)",
      title: "건드리면 물어뜯는 도로 위의 매드맥스",
      desc: "브레이크가 아예 고장 났습니다. 엘리베이터 문 닫기 신공부터 보복 가속까지, 참을성이란 게 뇌에서 삭제된 상태입니다. 주변 사람들은 당신 눈치 보느라 수명이 줄어들고 있습니다.",
      img: "image/devil_4.png"
    },
    archdemon: {
      type: "지옥행 하이패스 프리패스권 소지자, 순도 100% 생태계 교란종 (완전체형)",
      title: "인간 껍데기만 뒤집어쓴 지옥 대공 바알제붑 본인",
      desc: "이 정도면 친구들이 당신을 멀리하지 않는 게 기적입니다. 양심이라는 부품이 조립 단계에서 누락된 수준이며, 친구 물건 훔칠까 고민하고 변기 막히면 튀는 악행을 스포츠처럼 즐기는 완성형 괴물입니다.",
      img: "image/devil_5.png"
    }
  };

  const TOTAL = QUESTIONS.length;
  const AUTO_DELAY = 300;

  let current = 0;
  let answers = new Array(TOTAL).fill(null);
  let locked = false;

  const $ = (id) => document.getElementById(id);
  const card = $('card');
  const prevBtn = $('prevBtn');
  const screens = {
    intro: $('introScreen'),
    quiz: $('quizScreen'),
    result: $('resultScreen')
  };

  /* ---------- 화면 전환 ---------- */
  function showScreen(name) {
    card.classList.add('fade-out');
    updatePrevBtn(name);
    setTimeout(() => {
      Object.values(screens).forEach(s => s.classList.remove('active'));
      screens[name].classList.add('active');
      card.classList.remove('fade-out');
      window.scrollTo(0, 0);
    }, 300);
  }

  // 이전 버튼은 질문 화면 2번 문항부터만 노출
  function updatePrevBtn(screenName = 'quiz') {
    prevBtn.classList.toggle('show', screenName === 'quiz' && current > 0);
  }

  /* ---------- 질문 렌더링 ---------- */
  function renderQuestion() {
    $('qNum').textContent = `Q${current + 1}.`;
    $('qText').textContent = QUESTIONS[current];
    $('progressCount').innerHTML = `${current + 1} <small>/ ${TOTAL}</small>`;
    $('progressFill').style.width = `${((current + 1) / TOTAL) * 100}%`;

    document.querySelectorAll('.ans').forEach(btn => {
      btn.classList.toggle('selected', btn.dataset.answer === answers[current]);
    });
    updatePrevBtn();
  }

  function goTo(index) {
    if (index < 0 || index >= TOTAL) return;
    locked = true;
    const body = $('qBody');
    body.classList.add('fade-out');
    setTimeout(() => {
      current = index;
      renderQuestion();
      body.classList.remove('fade-out');
      body.classList.add('fade-in-start');
      requestAnimationFrame(() => requestAnimationFrame(() => body.classList.remove('fade-in-start')));
      locked = false;
    }, 300);
  }

  // 답변 선택 -> 활성화 스타일 -> 0.3초 후 자동 진행
  function selectAnswer(value) {
    if (locked) return;
    locked = true;
    answers[current] = value;
    document.querySelectorAll('.ans').forEach(btn => {
      btn.classList.toggle('selected', btn.dataset.answer === value);
    });

    setTimeout(() => {
      if (current < TOTAL - 1) {
        goTo(current + 1);
      } else {
        locked = false;
        finish();
      }
    }, AUTO_DELAY);
  }

  /* ---------- 채점 ---------- */
  function calculate(yesCount) {
    if (yesCount <= 3) return { key: 'liar', score: 300, liar: true };
    const score = yesCount * 10;
    let key;
    if (score <= 90) key = 'imp';
    else if (score <= 170) key = 'reaper';
    else if (score <= 240) key = 'rage';
    else key = 'archdemon';
    return { key, score, liar: false };
  }

  function finish() {
    const yesCount = answers.filter(a => a === 'yes').length;
    const result = calculate(yesCount);
    history.replaceState(null, '', `#r=${result.key}&s=${result.score}`);
    renderResult(result);
    showScreen('result');
  }

  /* ---------- 결과 렌더링 ---------- */
  function renderResult({ key, score, liar }) {
    const r = RESULTS[key];
    $('rImg').src = r.img;
    $('rScore').innerHTML = `${score}<small> / 300점</small>`;
    $('rBadge').innerHTML = liar ? '<span class="lie-badge">거짓말 탐지기 작동 - 강제 만점 처리</span>' : '';
    $('rType').textContent = r.type;
    $('rTitle').textContent = r.title;
    $('rDesc').textContent = r.desc;
  }

  // 결과 이미지는 용량이 커서 테스트 시작 시점에 미리 받아둠
  let preloaded = false;
  function preloadResultImages() {
    if (preloaded) return;
    preloaded = true;
    Object.values(RESULTS).forEach(r => { const i = new Image(); i.src = r.img; });
  }

  /* ---------- 유틸 ---------- */
  let toastTimer;
  function showToast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  async function copyLink() {
    const url = location.href;
    try {
      await navigator.clipboard.writeText(url);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = url;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
    }
    showToast('결과 링크가 복사되었습니다');
  }

  function reset() {
    current = 0;
    answers = new Array(TOTAL).fill(null);
    locked = false;
    history.replaceState(null, '', location.pathname + location.search);
    renderQuestion();
    showScreen('quiz');
  }

  function createEmbers() {
    const wrap = $('embers');
    const count = window.innerWidth < 600 ? 18 : 32;
    for (let i = 0; i < count; i++) {
      const e = document.createElement('span');
      e.className = 'ember';
      const size = 2 + Math.random() * 4;
      e.style.width = e.style.height = size + 'px';
      e.style.left = Math.random() * 100 + '%';
      e.style.animationDuration = 6 + Math.random() * 8 + 's';
      e.style.animationDelay = Math.random() * 10 + 's';
      if (Math.random() > 0.7) {
        e.style.background = '#b026ff';
        e.style.boxShadow = '0 0 8px #b026ff, 0 0 16px #b026ff';
      }
      wrap.appendChild(e);
    }
  }

  /* ---------- 공유 링크로 진입 시 결과 바로 표시 ---------- */
  function loadFromHash() {
    const params = new URLSearchParams(location.hash.slice(1));
    const key = params.get('r');
    const score = parseInt(params.get('s'), 10);
    if (key && RESULTS[key] && !isNaN(score)) {
      renderResult({ key, score: Math.max(0, Math.min(300, score)), liar: key === 'liar' });
      Object.values(screens).forEach(s => s.classList.remove('active'));
      screens.result.classList.add('active');
    }
  }

  /* ---------- 이벤트 ---------- */
  $('startBtn').addEventListener('click', () => {
    preloadResultImages();
    renderQuestion();
    showScreen('quiz');
  });
  document.querySelectorAll('.ans').forEach(btn => {
    btn.addEventListener('click', () => selectAnswer(btn.dataset.answer));
  });
  prevBtn.addEventListener('click', () => {
    if (!locked && current > 0) goTo(current - 1);
  });
  $('retryBtn').addEventListener('click', reset);
  $('copyBtn').addEventListener('click', copyLink);

  createEmbers();
  loadFromHash();
</script>
</body>
</html>
